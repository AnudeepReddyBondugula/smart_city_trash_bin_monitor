name: Feature Branch Policy

on:
    workflow_call:
        inputs:
            service:
                required: true
                type: string
            
            task:
                required: true
                type: string

jobs:
    
    enforce-feature-policy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Get changed files
                id: changes
                uses: tj-actions/changed-files@v44

            -   name: Enforce feature scope
                run: |
                    set -e

                    SERVICE=${{ inputs.service }}
                    TASK=${{ inputs.task }}

                    echo "🔍 Enforcing feature policy for service: $SERVICE"

                    echo "Changed files:"
                    for file in ${{ steps.changes.outputs.all_changed_files }}; do
                        echo " - $file"
                    done

                    if [[ "$TASK" == "docs" ]]; then
                        for file in ${{ steps.changes.outputs.all_changed_files }}; do
                            # Allow only docs/features/<service>/ directory
                            if [[ "$file" =~ ^docs/features/$SERVICE/ ]]; then
                                continue
                            fi

                            echo "❌ Invalid change detected: $file"
                            echo "Feature branches may ONLY modify:"
                            echo "  docs/features/$SERVICE/**"
                            # exit 1 (Policy disabled for development)
                        done
                    else
                        for file in ${{ steps.changes.outputs.all_changed_files }}; do
                            # Allow only this service's directory
                            if [[ "$file" =~ ^services/$SERVICE/ ]]; then
                            continue
                            fi

                            echo "❌ Invalid change detected: $file"
                            echo "Feature branches may ONLY modify:"
                            echo "  services/$SERVICE/**"
                            # exit 1 (Policy disabled for development)
                        done
                    fi

                    echo "✅ Feature policy passed"

    run-pytest:
        runs-on: ubuntu-latest
        needs: enforce-feature-policy   # only run tests if feature-policy passes
        steps:
        -   name: Checkout
            uses: actions/checkout@v4

        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: '3.11'
        
        -   name: Ruff Lint
            uses: chartboost/ruff-action@v1
            with:
                args: check .

        -   name: Docker Build & Test
            run: |
                docker build -t ${{inputs.service}}-test --target test -f ./services/${{inputs.service}}/Dockerfile ./services/${{inputs.service}}